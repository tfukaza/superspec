<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SuperSpec — Rust AML editor</title></head>
<body><header><div><strong>SuperSpec</strong> <span>Rust / Wasm · Three.js</span></div><button id="download">Download AML</button><button id="validate" disabled>Validate</button><button id="download-glb" disabled>Download GLB</button><label title="KTX2 (KHR_texture_basisu) is several times smaller on disk and in GPU memory. Turn off for PNG, e.g. for Blender."><input id="export-ktx2" type="checkbox" checked> KTX2 textures</label><output id="export-status" role="status"></output><button id="restart">Restart compiler</button><button id="walk">Walk</button></header>
<main><section class="source"><nav class="editor-links" aria-label="Editors"><a href="/" aria-current="page">Level</a><a href="/material.html">Material</a><a href="/item.html">Item</a></nav><label for="aml">AML source</label><p>Edit architecture and preview it live. Edits stay in this browser tab.</p><div class="open-controls"><label>Open AML and companions <input id="open-aml" type="file" multiple></label><label>Open AML folder <input id="open-folder" type="file" webkitdirectory multiple></label></div><label for="assets">Add local companion assets</label><input id="assets" type="file" multiple><label for="asset-folder">Add a companion folder (keeps its folder name)</label><input id="asset-folder" type="file" webkitdirectory multiple><button id="clear-assets">Clear companion assets</button><textarea id="aml" spellcheck="false" aria-describedby="status"></textarea><output id="status" role="status" data-state="loading">Loading compiler…</output><pre id="diagnostics" aria-live="polite"></pre></section><section class="preview"><div id="viewport" aria-label="Three-dimensional scene"></div><div class="caption"><strong id="title">Preview</strong><label class="walk-controls">Movement helper <select id="walk-helper"><option value="off">Off</option><option value="jump">Repeat jump</option><option value="crouch">Crouch</option></select></label><span id="details">Structural assertions run during compilation. Navigation has not been validated.</span><span id="selection">Click a model to inspect its source.</span></div></section></main>
<script type="module" src="/main.ts"></script></body></html>
