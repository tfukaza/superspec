name: SuperSpec native and browser
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo run --quiet -p superspec-architecture-check --locked
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --no-fail-fast --locked -- --test-threads=1
      - run: cargo build -p superspec-cli --release --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:native-viewer
      - run: npm run test:native-studio
      - name: Native command smoke without Node
        shell: pwsh
        run: |
          $executable = if ($IsWindows) { Join-Path $PWD 'target/release/superspec.exe' } else { Join-Path $PWD 'target/release/superspec' }
          $env:PATH = ''
          & $executable validate tests/fixtures/aml/rust-stage1.aml --json
          if ($LASTEXITCODE -ne 0) { throw 'Native validation failed.' }
          & $executable generate --archetype ring --seed ci --out generated/ci-ring.aml --json
          if ($LASTEXITCODE -ne 0) { throw 'Native generation failed.' }
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo build -p superspec-cli --release --locked
      - run: cargo build -p superspec-wasm --target wasm32-unknown-unknown --release --locked
      - run: wasm-bindgen --target web --out-dir generated/wasm target/wasm32-unknown-unknown/release/superspec_wasm.wasm
      - run: npm ci
      - run: npm run build:native-viewer
      - run: npm run test:native-studio
        env:
          CHECK_WASM_PARITY: "1"
      - run: npm run build:rust-ui
      - run: npm run check
      - run: npm run pack:three
      - run: npm run test:city-runtime
      - run: node --test tests/browser/rust-packet.test.ts tests/browser/rust-updates.test.ts
      - run: npx playwright install --with-deps chromium
      - run: node tests/rust-preview-browser.mjs
      - run: node tests/rust-studio-browser.mjs
      - run: node tests/authoring-world-browser.mjs
      - run: cargo build -p superspec-kernel-acceptance --target wasm32-unknown-unknown --release --locked
      - run: wasm-bindgen --target web --out-dir generated/wasm-tests target/wasm32-unknown-unknown/release/superspec_kernel_acceptance.wasm
      - run: node tests/material-program-browser.mjs
      - run: node tests/rust-kernels-browser.mjs
