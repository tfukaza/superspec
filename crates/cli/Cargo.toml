[package]
name = "superspec-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "superspec"

[[bin]]
name = "superspec"
path = "src/main.rs"

[dependencies]
tiny_http = "=0.12.0"
superspec-profiles = { path = "../profiles" }
superspec-catalog = { path = "../catalog" }
superspec-aml = { path = "../aml" }
superspec-engine = { path = "../engine", features = ["authoring"] }
superspec-geometry = { path = "../geometry" }
superspec-export = { path = "../export" }
superspec-types = { path = "../types" }
serde.workspace = true
serde_json.workspace = true
ctrlc = "3.5"
sha2 = "=0.10.9"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "=0.22.1"
crc32fast = "1.5"
flate2 = "1.1"
skrifa = "0.50.0"

[dev-dependencies]
superspec-model = { path = "../model" }
tempfile = "3.23"

[lints]
workspace = true
