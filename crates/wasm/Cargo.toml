[package]
name = "superspec-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
threads = ["superspec-engine/wasm-threads", "dep:wasm-bindgen-rayon"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "=1.3.0", optional = true }

[dependencies]
superspec-model = { path = "../model" }
superspec-engine = { path = "../engine" }
superspec-export = { path = "../export" }
superspec-types = { path = "../types" }
superspec-geometry = { path = "../geometry" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
serde_json.workspace = true

[lints]
workspace = true
