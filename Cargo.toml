[workspace]
members = [
    "crates/aml",
    "crates/catalog",
    "crates/cli",
    "crates/engine",
    "crates/export",
    "crates/geometry",
    "crates/model",
    "crates/profiles",
    "crates/types",
    "crates/wasm",
    "tests/rust-kernels",
    "tools/architecture",
]
resolver = "3"
# Vendored third-party crates build with their own settings, not the workspace lints.
exclude = ["third_party/basisu_c_sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
roxmltree = "0.21.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

